name: Deployment

on: workflow_dispatch

jobs:
  install-tools:
    name: Install tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0
      - name: Install tools
        run: ./scripts/install-tools.sh
      - name: Cache tools
        uses: actions/cache@v4.2.4
        with:
          path: ~/.rokit
          key: tools-${{ hashFiles('rokit.toml') }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [install-tools]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0
      - name: Restore cached tools
        uses: actions/cache@v4.2.4
        with:
          path: ~/.rokit
          key: tools-${{ hashFiles('rokit.toml') }}
      - name: Deploy
        env:
          DEPLOY_API_KEY: ${{ secrets.DEPLOY_API_KEY }}
        run: ~/.rokit/bin/lune run scripts/lune/deploy.luau
